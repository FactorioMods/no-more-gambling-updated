quality-probabilities=The chance of producing an item with higher quality is 25% with one [item=quality-module,quality=normal] and can go up to 200% with four [item=quality-module-3,quality=legendary].\nThere is also a small chance of skipping steps and getting higher quality directly as shown in the table.
